<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Gastos</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>💰 Gestor de Gastos</h1>
            <p class="subtitle">Administra tus finanzas de forma sencilla</p>
        </div>
    </header>

    <main class="container">
        <!-- Resumen -->
        <section class="summary-cards">
            <div class="card summary-card">
                <span class="card-label">Total Gastado</span>
                <span class="card-value" id="total-general">$0</span>
            </div>
            <div class="card summary-card">
                <span class="card-label">Gastos Registrados</span>
                <span class="card-value" id="total-cantidad">0</span>
            </div>
        </section>

        <!-- Formulario -->
        <section class="card form-section">
            <h2>Registrar Nuevo Gasto</h2>
            <form id="form-gasto">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="descripcion">Descripción</label>
                        <input type="text" id="descripcion" placeholder="Ej: Almuerzo" required>
                    </div>
                    <div class="form-group">
                        <label for="monto">Monto ($)</label>
                        <input type="number" id="monto" placeholder="0" min="1" step="any" required>
                    </div>
                    <div class="form-group">
                        <label for="categoria">Categoría</label>
                        <select id="categoria" required>
                            <option value="">Seleccionar...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fecha">Fecha</label>
                        <input type="date" id="fecha" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Registrar Gasto</button>
            </form>
        </section>

        <!-- Filtro por categoría -->
        <section class="card filter-section">
            <h2>Total por Categoría</h2>
            <div class="category-totals" id="category-totals"></div>
        </section>

        <!-- Lista de gastos -->
        <section class="card">
            <h2>Historial de Gastos</h2>
            <div class="table-container">
                <table id="tabla-gastos">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Descripción</th>
                            <th>Monto</th>
                            <th>Categoría</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="gastos-body">
                    </tbody>
                </table>
                <p class="empty-state" id="empty-state">No hay gastos registrados.</p>
            </div>
        </section>
    </main>

    <!-- Toast de notificaciones -->
    <div class="toast-container" id="toast-container"></div>

    <footer class="footer">
        <div class="container">
            <p></p>
        </div>
    </footer>

    <script src="/app.js"></script>
</body>
</html>
